# CRP vNext MVP — Authoritative Role Registry (v1)
#
# Declarative, deterministic registry DATA only. Ratified authority:
#   - CRP-OD-5 / CRP-OD-11 (CRP_VNEXT_ARCHITECTURE_RATIFICATION_v1.md)
#   - CRP_MVP_SPEC_v1.md §3 (OWNER_RATIFIED_SPECIFICATION, 2026-08-16)
#   - CRP_MVP_CONTRACTS_v1.md §F (RoleRegistryEntry field schema)
#
# Semantics (non-negotiable, CRP-OD-11):
#   - explicit catalog, NOT filesystem auto-discovery
#   - exact version pinned per entry; never "latest"/"current"/"*"/"auto"
#   - no automatic promotion to ACTIVE; activation_gate must hold a
#     human-approval reference before a version becomes usable
#   - duplicate role_id is rejected fail-closed by the loader
#   - deterministic order = file order
#
# This file describes roles/versions/statuses/execution types ONLY. It grants
# no new capabilities and does not alter the broad-core capability surface.
# No secrets, no provider API config, no model credentials, no absolute paths.

roles:
  # ---------------------------------------------------------------- R1
  # v3 (CRP-OD-R4-KIRA-R1-V3-01): owner-approved quality correction of v2 --
  # corroboration merge, self-contained claims, no semantic-duplicate
  # restatements, non-mechanical rationale, exact claim-level evidence
  # accounting, and provenance_summary consistency. Prompt/schema shape,
  # permissions, and downstream contract are preserved from v2. Under the
  # single-entry RoleRegistry contract (exact version pin, no latest-wins),
  # v2 is no longer a resolvable active R1 version; the v2 prompt file is
  # retained on disk as the immutable predecessor artifact.
  - role_id: R1
    display_name: Evidence Interviewer
    version: v3
    status: ACTIVE
    execution_type: LLM_ROLE
    prompt_ref: roles/vnext/ROLE_1_EVIDENCE_INTERVIEWER_v3_PROMPT.md
    knowledge_profile_ref: profile-r1
    input_contract_ref: role_task_v1
    output_contract_ref: role_result_v1
    permissions:
      - READ_SOURCE_EVIDENCE
      - EMIT_SOURCE_EVIDENCE
      - EMIT_QUESTION_PLAN
      - EMIT_CLAIMS_UNKNOWN
      - EMIT_CLAIMS_IDENTITY_BIOGRAPHY
      - EMIT_CLAIMS_RELATIONSHIPS
      - EMIT_CLAIMS_BOUNDARIES
      - EMIT_CLAIMS_SEED_MEMORY
    activation_gate: "CRP-OD-R4-KIRA-R1-V3-01"
    predecessor_version: v2

  # ---------------------------------------------------------------- R2
  # v3 (RUN_010): owner-approved prompt-contract correction of v2. R2 v2
  # emitted claim_type=UNKNOWN, but R2 correctly lacks EMIT_CLAIMS_UNKNOWN and
  # the executor rejected it fail-closed. The permission model is correct; the
  # fix is prompt-only: claim_type=UNKNOWN is no longer in R2's output enum,
  # and insufficient evidence routes to top-level `unknowns`. Permissions and
  # downstream contract are preserved from v2. Under the single-entry registry
  # contract (exact version pin, no latest-wins), v2 is no longer a resolvable
  # active R2 version; the v2 prompt file is retained on disk as the immutable
  # predecessor artifact.
  - role_id: R2
    display_name: Psychological Hypothesis Analyst
    version: v3
    status: ACTIVE
    execution_type: LLM_ROLE
    prompt_ref: roles/vnext/ROLE_2_PSYCHOLOGICAL_HYPOTHESIS_ANALYST_v3_PROMPT.md
    knowledge_profile_ref: profile-r2
    input_contract_ref: role_task_v1
    output_contract_ref: role_result_v1
    permissions:
      - READ_SOURCE_EVIDENCE
      - READ_PRIOR_ROLE_RESULTS
      - EMIT_CLAIMS_PSYCHOLOGY
      - EMIT_CLAIMS_BEHAVIOR
      - EMIT_CLAIMS_RELATIONSHIPS
    activation_gate: "CRP_MVP_SPEC_v1@2026-08-16:OWNER_RATIFIED_SPECIFICATION"
    predecessor_version: v2

  # ---------------------------------------------------------------- R3
  # ACTIVE in the registry (technically executable). R3 remains per-task gated
  # by CRP-OD-9: every R3 RoleTask still requires a non-empty
  # activation_authorization_ref (role_task.py GATED_OPTIONAL_ROLES). The first
  # canonical Kira reconstruction (CRP-OD-R4-KIRA-R3-01) REQUIRES R3. Registry
  # ACTIVE does NOT auto-insert R3 into reconstruction runs: role selection
  # stays caller-owned.
  - role_id: R3
    display_name: Optional Intimacy Profile Specialist
    version: v1
    status: ACTIVE
    execution_type: LLM_ROLE
    prompt_ref: roles/vnext/ROLE_3_INTIMACY_PROFILE_SPECIALIST_v1_PROMPT.md
    knowledge_profile_ref: profile-r3
    input_contract_ref: role_task_v1
    output_contract_ref: role_result_v1
    permissions:
      - READ_SOURCE_EVIDENCE
      - READ_PRIOR_ROLE_RESULTS
      - EMIT_CLAIMS_INTIMACY
    activation_gate: "PER_TASK_AUTHORIZATION_REQUIRED_CRP-OD-9_KIRA_REQUIRED_CRP-OD-R4-KIRA-R3-01"

  # ---------------------------------------------------------------- R4
  # v2 (RUN_012): owner-approved prompt-contract / evidence-boundary correction
  # of v1. R4 v1's OUTPUT_CONTRACT told the model NOT to emit
  # `voice_pattern_label` because of an executor gap that no longer exists; the
  # model compensated by inventing `claim_type=NEGATIVE_EXAMPLE`, which is not a
  # ClaimType value, and the executor rejected it fail-closed. The fix is
  # prompt-only: `voice_pattern_label` is an executor-supported first-class
  # field (OBSERVED / INFERRED / GENERATED_RULE / NEGATIVE_EXAMPLE), independent
  # of `claim_type`; `claim_type=NEGATIVE_EXAMPLE` is never legal; and OBSERVED
  # voice claims now require actual attributed speech evidence rather than
  # owner-authored descriptive prose. Permissions, activation gate, role
  # identity, and downstream contract are preserved from v1. Under the
  # single-entry registry contract (exact version pin, no latest-wins), v1 is no
  # longer a resolvable active R4 version; the v1 prompt file is retained on
  # disk as the immutable predecessor artifact.
  - role_id: R4
    display_name: Voice Reconstruction Analyst
    version: v2
    status: ACTIVE
    execution_type: LLM_ROLE
    prompt_ref: roles/vnext/ROLE_4_VOICE_RECONSTRUCTION_ANALYST_v2_PROMPT.md
    knowledge_profile_ref: profile-r4
    input_contract_ref: role_task_v1
    output_contract_ref: role_result_v1
    permissions:
      - READ_SOURCE_EVIDENCE
      - READ_PRIOR_ROLE_RESULTS
      - EMIT_CLAIMS_VOICE
    activation_gate: "CRP_MVP_SPEC_v1@2026-08-16:OWNER_RATIFIED_SPECIFICATION"
    predecessor_version: v1

  # ---------------------------------------------------------------- R5
  # Not implemented, out of MVP scope (CRP-OD-11). INACTIVE; no prompt file.
